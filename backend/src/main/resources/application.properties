spring.datasource.url=jdbc:h2:file:./data/testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# JWT 密钥 —— 请在 application-local.properties 或环境变量中配置真实值
jwt.secret=${JWT_SECRET:default-dev-secret-change-me-this-is-long-enough-for-hs256}
jwt.expiration=86400000

spring.data.redis.host=localhost
spring.data.redis.port=6379

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# QWeather API —— 请在 application-local.properties 或环境变量中配置真实值
qweather.api.host=${QWEATHER_API_HOST:changeme}
qweather.api.public-key=${QWEATHER_PUBLIC_KEY:changeme}
qweather.api.private-key=${QWEATHER_PRIVATE_KEY:changeme}
qweather.api.key-id=${QWEATHER_KEY_ID:changeme}
