# ============================================================
# 旅游推荐系统 Nginx 配置
# 用法: sudo cp nginx.conf /etc/nginx/nginx.conf && sudo nginx -t && sudo nginx -s reload
# ============================================================

worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 512;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    tcp_nopush  on;
    gzip        on;
    gzip_types  text/plain text/css application/json application/javascript text/xml;

    # 提取真实客户端 IP：优先 CF-Connecting-IP，备选 X-Forwarded-For
    map $http_cf_connecting_ip $real_client_ip {
        ""      $http_x_forwarded_for;
        default $http_cf_connecting_ip;
    }

    # ---------- 限流：每真实 IP 每秒 10 请求 ----------
    limit_req_zone $real_client_ip zone=global:10m rate=10r/s;
    # 认证接口限流：每真实 IP 每分钟 5 次
    limit_req_zone $real_client_ip zone=auth:10m rate=5r/m;

    server {
        listen       80;
        server_name  localhost lengshangbai.my www.lengshangbai.my;

        # ---------- 屏蔽敏感路径 ----------
        location ~ /\.(git|env|gitignore|gitmodules) { return 404; }

        # ---------- 安全头 ----------
        add_header X-Content-Type-Options    "nosniff"          always;
        add_header X-Frame-Options           "DENY"             always;
        add_header X-XSS-Protection          "1; mode=block"    always;
        add_header Referrer-Policy           "strict-origin"    always;

        # ---------- 前端静态文件 ----------
        root /home/leng/Study/LvYou/frontend/dist;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # ---------- 后端 API 反代 ----------
        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $real_client_ip;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ---------- 认证接口限流 ----------
        location /api/auth/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $real_client_ip;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ---------- 屏蔽 H2 控制台 ----------
        location /h2-console {
            return 404;
        }
    }
}
